<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(120deg, #89f7fe, #66a6ff);
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 25px;
            color: white;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 5px;
            font-size: 18px;
        }

        /* LAYOUT */
        .container {
            display: flex;
            padding: 30px;
            gap: 20px;
        }

        /* CARD STYLE */
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        }

        /* LEFT PANEL */
        .left {
            width: 30%;
            text-align: center;
        }

        .left h2 {
            color: #4facfe;
        }

        /* RIGHT PANEL */
        .right {
            width: 70%;
        }

        /* INPUT GRID */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4facfe;
            box-shadow: 0px 0px 5px #4facfe;
            outline: none;
        }

        /* BUTTON */
        .btn {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        }

        /* PREDICTION BOX */
        .prediction {
            margin-top: 20px;
            padding: 15px;
            background: #e6fff2;
            border-left: 5px solid green;
            border-radius: 8px;
            font-size: 20px;
            color: green;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>🏢 Viharatech Company</h1>
        <p><b>House Price Prediction using Machine Learning</b></p>
    </div>

    <!-- CONTENT -->
    <div class="container">

        <!-- LEFT CARD -->
        <div class="card left">
            <h2>👩‍💻Suripaka Ramadevi</h2>
            <p><b>Data Analyst & ML Engineer</b></p>
            <p>This project predicts house prices using Multiple Linear Regression.</p>
        </div>

        <!-- RIGHT CARD -->
        <div class="card right">
            <h2>🏠 Enter House Details</h2>

            <form action="/predict" method="post">

                <div class="form-grid">
                    <input type="text" name="bedrooms" placeholder="Bedrooms">
                    <input type="text" name="bathrooms" placeholder="Bathrooms">
                    <input type="text" name="sqft_living" placeholder="Sqft Living">
                    <input type="text" name="sqft_lot" placeholder="Sqft Lot">
                    <input type="text" name="floors" placeholder="Floors">
                    <input type="text" name="waterfront" placeholder="Waterfront">
                    <input type="text" name="view" placeholder="View">
                    <input type="text" name="condition" placeholder="Condition">
                    <input type="text" name="sqft_above" placeholder="Sqft Above">
                    <input type="text" name="sqft_basement" placeholder="Sqft Basement">
                    <input type="text" name="yr_built" placeholder="Year Built">
                    <input type="text" name="yr_renovated" placeholder="Year Renovated">
                    <input type="text" name="city" placeholder="City (0-43)">
                    <input type="text" name="country" placeholder="Country (0)">
                </div>

                <button class="btn" type="submit">🚀 Predict Price</button>

            </form>

            {% if prediction_text %}
            <div class="prediction">
                {{ prediction_text }}
            </div>
            {% endif %}

        </div>

    </div>

</body>
</html>
